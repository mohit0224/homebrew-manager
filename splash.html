<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>HomeBrew Manager</title>
		<style>
			*, *::before, *::after {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				outline: none;
				user-select: none;
				-webkit-user-select: none;
			}

			html, body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 12px;
				overflow: hidden;
				background: transparent !important;
				border: none !important;
				outline: none !important;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			.splash-container {
				width: 100%;
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: #FFFFFF;
				border-radius: 18px;
				border: 1px solid rgba(0, 0, 0, 0.08);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
				overflow: hidden;
				-webkit-app-region: drag;
				cursor: default;
			}

			.logo-wrapper {
				width: 84px;
				height: 84px;
				margin-bottom: 18px;
				border-radius: 20px;
				border: 1px solid rgba(0, 0, 0, 0.08);
				box-shadow:
					0 8px 24px -4px rgba(255, 23, 111, 0.22),
					0 4px 12px rgba(0, 0, 0, 0.06);
				overflow: hidden;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #FFFFFF;
			}

			.logo-img {
				width: 100%;
				height: 100%;
				object-fit: contain;
			}

			.app-title {
				font-size: 20px;
				font-weight: 700;
				color: #111827;
				letter-spacing: -0.02em;
				margin-bottom: 4px;
			}

			.app-subtitle {
				font-size: 12px;
				font-weight: 500;
				color: #6B7280;
				letter-spacing: -0.01em;
				margin-bottom: 26px;
			}

			.loader-track {
				width: 180px;
				height: 4px;
				background: #F1F3F9;
				border-radius: 9999px;
				overflow: hidden;
				position: relative;
			}

			.loader-bar {
				position: absolute;
				top: 0;
				left: 0;
				height: 100%;
				width: 15%;
				background: linear-gradient(90deg, #FF176F, #FF5B97);
				border-radius: 9999px;
				will-change: transform;
				animation: indeterminateSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
			}

			@keyframes indeterminateSlide {
				0% {
					transform: translateX(-120%);
				}
				100% {
					transform: translateX(700%);
				}
			}
		</style>
	</head>
